[versions]
agp = "8.6.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coroutines = "1.9.0"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"
composeBom = "2024.09.03"
navigationCompose = "2.8.2"
lifecycle = "2.8.6"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.7.3"
retrofitKotlinxSerializationConverter = "1.0.0"
room = "2.6.1"
workManager = "2.9.1"
biometric = "1.1.0"
securityCrypto = "1.1.0-alpha06"
timber = "5.0.1"
javaxInject = "1"
junit4 = "4.13.2"
mockk = "1.13.12"
